name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  lint-test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install --upgrade pip ruff pytest
      - name: Ruff
        run: ruff check primus tests admin_assistant.py
      - name: Pytest
        run: pytest

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t primus:ci .
